<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JFrame 统一日志</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161a22; --line: #262c38; --fg: #dbe2ef; --dim: #8b95a7;
    --accent: #4f8cff; --mono: Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 var(--mono); }
  header { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px;
           align-items: center; padding: 10px 14px; background: var(--panel);
           border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 14px 0 0; color: var(--accent); white-space: nowrap; }
  select, input, button { background: #1d2330; color: var(--fg); border: 1px solid var(--line);
           border-radius: 6px; padding: 4px 8px; font: inherit; outline: none; }
  input[type=text] { width: 180px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #conn { margin-left: auto; font-size: 12px; color: var(--dim); white-space: nowrap; }
  #conn.ok::before { content: "●"; color: #3fbf6f; margin-right: 5px; }
  #conn.bad::before { content: "●"; color: #e0564f; margin-right: 5px; }
  #list { padding: 6px 0 40px; }
  .row { display: flex; gap: 8px; padding: 2px 14px; border-bottom: 1px solid #1a1f2a; align-items: baseline; }
  .row:hover { background: #171c26; }
  .row .t { color: var(--dim); white-space: nowrap; }
  .tag { border-radius: 4px; padding: 0 6px; white-space: nowrap; font-size: 12px; }
  .msg { white-space: pre-wrap; word-break: break-all; flex: 1; }
  .lv-DEBUG { color: #7a8699; }
  .lv-INFO  { color: #4fae6a; }
  .lv-WARN  { color: #d6a33c; }
  .lv-ERROR { color: #e0564f; font-weight: bold; }
  details { margin: 2px 0 2px 0; }
  details pre { margin: 4px 0; padding: 6px 10px; background: #12161e; border-radius: 6px;
                color: #e08585; overflow-x: auto; font-size: 12px; }
  #empty { text-align: center; color: var(--dim); padding: 60px 0; }
</style>
</head>
<body>
<header>
  <h1>JFrame 统一日志</h1>
  <label>子服 <select id="server"><option value="all">全部子服</option></select></label>
  <label>来源 <select id="source"><option value="">全部来源</option></select></label>
  <label>级别 <select id="level">
    <option value="">全部</option><option>DEBUG</option><option selected>INFO</option>
    <option>WARN</option><option>ERROR</option>
  </select></label>
  <input type="text" id="search" placeholder="搜索…">
  <button id="pause">暂停</button>
  <button id="clear">清屏</button>
  <span id="conn" class="bad">连接中…</span>
</header>
<div id="list"><div id="empty">暂无日志</div></div>
<script>
(function () {
  var MAX = 5000;
  var entries = [];
  var paused = false;
  var es = null;
  var token = new URLSearchParams(location.search).get("token") || "";

  var $ = function (id) { return document.getElementById(id); };
  var serverSel = $("server"), sourceSel = $("source"), levelSel = $("level"),
      searchIn = $("search"), listEl = $("list"), connEl = $("conn"), pauseBtn = $("pause");

  function initialServer() {
    var m = location.pathname.match(/^\/s\/([^/]+)/);
    return m ? decodeURIComponent(m[1]) : (new URLSearchParams(location.search).get("server") || "all");
  }

  function hue(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    return h;
  }
  function tag(s, kind) {
    var h = hue(kind + ":" + s);
    return '<span class="tag" style="background:hsl(' + h + ',45%,22%);color:hsl(' + h + ',80%,72%)">' +
           escapeHtml(s) + "</span>";
  }
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function fmtTime(t) {
    var d = new Date(t), p = function (n, w) { return String(n).padStart(w || 2, "0"); };
    return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds()) + "." + p(d.getMilliseconds(), 3);
  }

  function rowHtml(e) {
    var stack = e.stack
      ? '<details><summary style="cursor:pointer;color:#8b95a7">堆栈</summary><pre>' + escapeHtml(e.stack) + "</pre></details>"
      : "";
    return '<div class="row"><span class="t">' + fmtTime(e.time) + "</span>" +
           tag(e.server, "srv") + tag(e.source, "src") +
           '<span class="lv-' + e.level + '">[' + e.level + "]</span>" +
           '<span class="msg">' + escapeHtml(e.message) + "</span>" + stack + "</div>";
  }

  var ORD = { DEBUG: 0, INFO: 1, WARN: 2, ERROR: 3 };
  function pass(e) {
    var lv = levelSel.value;
    if (lv && (ORD[e.level] == null || ORD[e.level] < ORD[lv])) return false;
    var src = sourceSel.value;
    if (src && e.source !== src) return false;
    var q = searchIn.value.trim().toLowerCase();
    if (q && (e.message + " " + e.source + " " + e.server).toLowerCase().indexOf(q) < 0) return false;
    return true;
  }

  function render() {
    var shown = entries.filter(pass);
    if (shown.length > MAX) shown = shown.slice(shown.length - MAX);
    listEl.innerHTML = shown.length
      ? shown.map(rowHtml).join("")
      : '<div id="empty">暂无日志</div>';
    if (!paused) window.scrollTo(0, document.body.scrollHeight);
  }

  function dedupeKey(e) { return e.server + "#" + e.seq; }
  function pushAll(arr) {
    var seen = {};
    entries.forEach(function (e) { seen[dedupeKey(e)] = true; });
    var fresh = arr.filter(function (e) { return !seen[dedupeKey(e)]; });
    if (!fresh.length) return;
    entries = entries.concat(fresh);
    if (entries.length > MAX * 2) entries = entries.slice(entries.length - MAX);
    entries.sort(function (a, b) { return a.time - b.time || (a.server < b.server ? -1 : 1) || a.seq - b.seq; });
    render();
  }

  function api(path) {
    return path + (path.indexOf("?") < 0 ? "?" : "&") + (token ? "token=" + encodeURIComponent(token) + "&" : "") + "r=" + Date.now();
  }

  function refreshServers() {
    fetch(api("/api/servers")).then(function (r) { return r.json(); }).then(function (list) {
      var cur = serverSel.value;
      serverSel.innerHTML = '<option value="all">全部子服</option>' + list.map(function (s) {
        return '<option value="' + escapeHtml(s.server) + '">' + escapeHtml(s.server) + " (" + s.entries + ")</option>";
      }).join("");
      serverSel.value = cur && (cur === "all" || list.some(function (s) { return s.server === cur; })) ? cur : "all";
      refreshSources();
    }).catch(function () {});
  }

  function refreshSources() {
    var srv = serverSel.value;
    fetch(api("/api/sources?server=" + encodeURIComponent(srv === "all" ? "all" : srv)))
      .then(function (r) { return r.json(); }).then(function (list) {
        var cur = sourceSel.value;
        var set = {};
        list.forEach(function (s) { if (srv === "all" || s.server === srv) set[s.source] = true; });
        var names = Object.keys(set).sort();
        sourceSel.innerHTML = '<option value="">全部来源</option>' + names.map(function (n) {
          return '<option value="' + escapeHtml(n) + '">' + escapeHtml(n) + "</option>";
        }).join("");
        sourceSel.value = names.indexOf(cur) >= 0 ? cur : "";
      }).catch(function () {});
  }

  function connect() {
    if (es) { es.close(); es = null; }
    var srv = serverSel.value === "all" ? "all" : serverSel.value;
    var url = api("/api/stream?server=" + encodeURIComponent(srv) + "&level=DEBUG");
    es = new EventSource(url);
    es.onopen = function () { connEl.textContent = "实时"; connEl.className = "ok"; };
    es.onerror = function () {
      connEl.textContent = "重连中…"; connEl.className = "bad";
      es.close(); es = null;
      setTimeout(connect, 2000);
    };
    es.onmessage = function (ev) {
      if (!ev.data) return;
      try { pushAll([JSON.parse(ev.data)]); } catch (e) {}
    };
  }

  serverSel.addEventListener("change", function () { entries = []; render(); refreshSources(); connect(); });
  sourceSel.addEventListener("change", render);
  levelSel.addEventListener("change", render);
  searchIn.addEventListener("input", render);
  pauseBtn.addEventListener("click", function () {
    paused = !paused;
    pauseBtn.textContent = paused ? "继续" : "暂停";
    if (!paused) window.scrollTo(0, document.body.scrollHeight);
  });
  $("clear").addEventListener("click", function () { entries = []; render(); });

  serverSel.value = initialServer();
  refreshServers();
  refreshSources();
  connect();
  setInterval(refreshServers, 10000);
})();
</script>
</body>
</html>
