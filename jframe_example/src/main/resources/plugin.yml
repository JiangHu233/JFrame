name: JFrameExample
main: io.github.JiangHu.jframe.example.ExamplePlugin
version: "1.0.0"
api: ["1.0.0"]
author: JiangHu
# 依赖前置插件 JFrame（jframe_main）：框架类（jframe_ecs / jframe_command 等）
# 由 JFrame 的类加载器统一加载，本插件不重复打包框架类（pom 中 jframe_main 为 provided scope）。
# 部署时需先放入 jframe_main.jar，再放入 jframe_example.jar。
depend:
  - JFrame
description: JFrame 示例插件 —— /ecs 命令实机测试实体-组件-系统引擎；/logdemo 演示统一日志（配合 /jlog start 网页查看）。
# 根命令 /ecs 由 jframe_command 动态注册（@CommandController），无需在此声明。
permissions:
  jframe.example.use:
    description: 允许使用示例插件命令
    default: true
