# ================================ JFrame 框架配置 ================================

# 模块预加载列表（可选）
#
# JFrame 各模块默认【懒加载】：业务插件首次调用对应 getXxxAPI() 时才初始化，
# 未用到的模块不创建任何对象，启动零成本。
#
# 如需在启动时立即加载某些模块（例如让其他插件在 JFrame onEnable 后即可通过
# ServiceManager 直取服务），在下方列出模块 id：
#
#   event        事件系统
#   command      命令系统
#   async        异步任务（ThreadAPI / TaskAPI / ThreadFlow / ReleaseAPI）
#   form         表单界面
#   inventory    箱子界面
#   data         数据持久化
#   ai           实体 AI
#   scoreboard   计分板
#   title        标题
#   engine       游戏引擎（ECS + 行为树）
#   floatingtext 浮空字
#   logger       统一日志（LoggerAPI；/jlog 指令首次执行亦会触发加载，无需预加载）
#   transform    动态类增强（TransformAPI；业务插件首次注册 hook 亦会触发加载）
#
# 示例：modules: [form, event]
# ==================================================================================

modules: []

# ============================ 动态类增强（transform 模块） ============================
#
# 依赖 JFrame 的插件可在服务器【正常启动后】动态增强 Nukkit（及任意非 JDK 类）的
# 已加载方法：@HookOn 注解声明式（HEAD/RETURN/REPLACE 签名镜像）或命令式
# hook()/replace()。首次注册时自动向 JVM 自附加 agent——零启动参数、零重启；
# JDK 21+ 控制台会打印一条动态附加警告，属预期、无害。
#
# 运维逃生口：false 时 getTransformAPI() 模块加载即报"已被禁用"，全部钩子不可用。
# 可选更稳路径：启动脚本加 -javaagent:jframe_main.jar 预注入（无警告、不依赖自附加）。
#
# 高级：bridge jar 注入落盘目录默认在本插件数据目录 transform/ 下（只读文件系统
# 环境会自动降级临时目录）。
# ======================================================================================

transform:
  enabled: true

# ================================ 统一日志（logger 模块） ================================
#
# 依赖 JFrame 的插件通过 getLoggerAPI().forPlugin(插件) 写入统一日志库：
# 默认静默（不进控制台/MCSM 面板，可按插件 setConsoleMirror(true) 镜像），
# 用 /jlog start 手动开启 Web 展示、/jlog stop 关闭（不开启时无端口占用、零线程）。
#
# 同 IP 多面板（一台机器多个 Nukkit 实例）：后来者 /jlog start 探测到端口已被
# 本机其它 JFrame logger 占用时自动挂靠（不重复开端），host 根路由汇总全部子服，
# /s/<server-id> 分面板查看；host 死亡后挂靠实例自动接管端口。
#
# logger:
#   buffer:
#     per-source: 5000   # 每来源（每子服×每插件）内存条数上限
#     global: 20000      # 全局内存条数上限（聚合视图收集范围）
#   persist: false       # true 时按天/按插件落盘到本目录 logs/（仅本 JVM 自身日志）
#   web:
#     bind: "0.0.0.0"    # host 对外绑定；挂靠探测/推送固定走 127.0.0.1
#     port: 18080        # 默认端口；/jlog start 不带参数时使用
#     server-id: ""      # 子服标识，默认 server-<本服端口>；同机多实例重复会被拒绝，需各自配置
#     token: ""          # 非空则 Web 访问需带 ?token=（明文基础防护；agent 需与 host 配置相同 token）
# ==========================================================================================

logger:
  buffer:
    per-source: 5000
    global: 20000
  persist: false
  web:
    bind: "0.0.0.0"
    port: 18080
    server-id: ""
    token: ""
